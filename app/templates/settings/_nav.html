<div class="settings-shell">
  <div class="surface-card settings-strip">
    <div class="stack-header">
      <div class="stack-title max-w-3xl">
        <p class="page-kicker">Control Center</p>
        <h2 class="page-title">Settings</h2>
        <p class="page-subtitle">Configure categories, accounts, policies, mappings, and access controls from one finance administration layer.</p>
      </div>
      <p class="count-pill">Admin Controls</p>
    </div>
    <div class="settings-tab-group">
      <a class="settings-tab {{ 'is-active' if request.endpoint == 'settings.categories' else '' }}" href="{{ url_for('settings.categories') }}">Categories</a>
      <a class="settings-tab {{ 'is-active' if request.endpoint == 'settings.accounts' else '' }}" href="{{ url_for('settings.accounts') }}">Accounts</a>
      <a class="settings-tab {{ 'is-active' if request.endpoint == 'settings.payment_methods' else '' }}" href="{{ url_for('settings.payment_methods') }}">Payment Methods</a>
      <a class="settings-tab {{ 'is-active' if request.endpoint == 'settings.budgets' else '' }}" href="{{ url_for('settings.budgets') }}">Budgets</a>
      <a class="settings-tab {{ 'is-active' if request.endpoint == 'settings.policies' else '' }}" href="{{ url_for('settings.policies') }}">Policies</a>
      <a class="settings-tab {{ 'is-active' if request.endpoint == 'settings.accounting_mappings' else '' }}" href="{{ url_for('settings.accounting_mappings') }}">Accounting</a>
      <a class="settings-tab {{ 'is-active' if request.endpoint == 'settings.users' else '' }}" href="{{ url_for('settings.users') }}">Users</a>
