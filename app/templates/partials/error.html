{% extends "base.html" %}
{% import "partials/ui.html" as ui %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
  <div class="error-shell space-y-6">
    {% call ui.page_header(title, message, "System") %}
      <a class="btn-secondary" href="{{ url_for('dashboard.overview') if current_user else url_for('auth.login') }}">Go back</a>
    {% endcall %}
    <div class="surface-card p-10">
      <div class="empty-state">
        <div>
          <p class="empty-state__title">{{ title }}</p>
          <p class="empty-state__body">{{ message }}</p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
