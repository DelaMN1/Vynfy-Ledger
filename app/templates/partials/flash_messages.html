{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-stack mb-6">
      {% for category, message in messages %}
        {% set tone = category if category in ['success', 'error'] else 'warning' %}
        <div class="flash-message flash-message--{{ tone }}" data-flash-message>
          <p class="flash-message__text">{{ message }}</p>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
