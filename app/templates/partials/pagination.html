{% if pagination.pages > 1 %}
  <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
    <span class="table-muted text-sm">Page {{ pagination.page }} of {{ pagination.pages }}</span>
    <div class="flex flex-wrap gap-3">
      {% if pagination.has_prev %}
        <a class="btn-secondary" href="?page={{ pagination.prev_num }}">Previous</a>
      {% endif %}
      {% if pagination.has_next %}
        <a class="btn-secondary" href="?page={{ pagination.next_num }}">Next</a>
      {% endif %}
    </div>
  </div>
{% endif %}
