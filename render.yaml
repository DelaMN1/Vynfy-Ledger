databases:
  - name: vynfy-ledger-db
    databaseName: vynfy_ledger
    user: vynfy_user

services:
  - type: web
    name: vynfy-ledger
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vynfy-ledger-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SECURITY_PASSWORD_SALT
        generateValue: true
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUST_PROXY_COUNT
        value: "1"
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: SELF_SERVICE_PASSWORD_RESET_ENABLED
        value: "false"
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: COMPANY_NAME
        value: Vynfy
      - key: MAIL_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
